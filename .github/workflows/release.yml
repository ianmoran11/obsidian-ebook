name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag and manifest versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release -- "$RELEASE_TAG"

      - name: Run tests
        run: npm test

      - name: Build release assets
        run: npm run release

      - name: Publish BRAT-compatible GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--draft --verify-tag --title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          # Keep the release hidden until all assets have uploaded successfully.
          gh release create "$RELEASE_TAG" "${options[@]}" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            dist/LICENSE \
            dist/THIRD-PARTY-NOTICES.md \
            "dist/epub-importer-${RELEASE_TAG}.zip"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
